name: VietDub core release gates
on:
  pull_request:
    paths:
      - 'translation/**'
      - 'tts/duration_fit.py'
      - 'core/release_quality.py'
      - 'core/orchestrator.py'
      - 'tests/test_translation.py'
      - 'tests/test_duration_fit.py'
      - '.github/workflows/vietdub-core-gates.yml'
  push:
    branches: [main]
jobs:
  core-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -q pytest numpy soundfile requests
      - name: Compile relevant modules
        run: python -m compileall -q translation core/release_quality.py core/orchestrator.py tts/duration_fit.py
      - name: Run real duration-fit WAV and translation contracts
        run: python -m pytest -q tests/test_translation.py tests/test_duration_fit.py
