name: VietDub four-PR integration rehearsal (read-only)

on:
  pull_request:
    paths: ['.github/workflows/vietdub-four-pr-rehearsal.yml']

permissions:
  contents: read

jobs:
  combine-and-test:
    if: github.event.pull_request.head.ref == 'feat/vieneu-tts-v3' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rehearse sequential merges of PR 11, 1, 4 and 6
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VietDub combined test'
          git config user.email 'combined-test@users.noreply.github.com'
          git fetch origin main ci/windows-release-smoke-20261031 ci/run-vietdub-20261016 feat/visual-cleanup-engine feat/vieneu-tts-v3
          git checkout -B test/integrate-all origin/main
          for ref in ci/windows-release-smoke-20261031 ci/run-vietdub-20261016 feat/vieneu-tts-v3 feat/visual-cleanup-engine; do
            echo "::group::Merge branch $ref"
            git merge --no-ff --no-edit -X theirs origin/"$ref"
            test -z "$(git diff --name-only --diff-filter=U)"
            git diff --check HEAD~1 HEAD
            echo "::endgroup::"
          done
          git log --oneline -8
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke and audio dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3
          python -m pip install -q pytest pytest-timeout numpy soundfile requests requests-toolbelt PySide6 'opencv-python-headless>=4.8,<5' imageio-ffmpeg
      - name: Check that all four PR capabilities survive
        run: |
          python -m compileall -q asr speaker core project translation tts ui media
          python - <<'PY'
          from pathlib import Path
          expected = {
              "core/orchestrator.py": ("select_asr_engine", "create_tts",
                  "visual_cleanup_enabled", "source_review"),
              "core/checkpoint.py": ("detected_speaker", "identity_verified"),
              "project/schema.py": ("tts_provider", "visual_cleanup_options",
                  "detected_src_lang"),
              "tts/provider.py": ("vieneu", "zerotts"),
              "tts/zerotts_local.py": ("class ZeroTTSLocal",),
              "tts/vieneu_tts.py": ("class VieNeuTTS",),
              "media/visual_cleanup.py": ("source_sha256",),
              "media/_bin.py": ("_bundled_binary", "ffprobe_cmd"),
              "translation/prompts.py": ("UNTRUSTED CONTENT",),
          }
          for file, terms in expected.items():
              body = Path(file).read_text(encoding="utf-8")
              missing = [term for term in terms if term not in body]
              assert not missing, f"{file} lost required features: {missing}"
          print("Combined feature survival assertions passed.")
          PY
      - name: Run end-to-end module integration and visual smoke regressions
        run: |
          python -m pytest -q --disable-warnings --maxfail=12             tests/test_checkpoint.py             tests/test_orchestrator.py             tests/test_speaker_identity_pipeline.py             tests/test_whisper_hybrid.py             tests/test_tts_provider_guard.py             tests/test_asr_language_router.py             tests/test_translation.py             tests/test_duration_fit.py             tests/test_edge_tts.py             tests/test_vietdub_stt_adapter.py             tests/test_vietdub_stt_http_e2e.py             tests/test_vieneu_tts.py             tests/test_vieneu_ui.py             tests/test_visual_job_config.py             tests/test_visual_cleanup.py             tests/test_visual_temporal.py             tests/test_visual_user_regions.py             tests/test_visual_tracking.py             tests/test_visual_detection.py             tests/test_render.py
