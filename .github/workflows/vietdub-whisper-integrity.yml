name: VietDub Whisper transcript integrity
on:
  push:
    branches: [ci/run-vietdub-20261016]
    paths:
      - 'asr/whisper_pyannote_adapter.py'
      - 'asr/whisper_align.py'
      - 'tests/test_whisper_hybrid.py'
      - '.github/workflows/vietdub-whisper-integrity.yml'
  pull_request:
    paths:
      - 'asr/whisper_pyannote_adapter.py'
      - 'asr/whisper_align.py'
      - 'tests/test_whisper_hybrid.py'
      - '.github/workflows/vietdub-whisper-integrity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcript-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate code and missing-word transcript scenarios
        run: |
          python -m pip install -q pytest
          python -m compileall -q asr/whisper_pyannote_adapter.py asr/whisper_align.py
          python -m pytest -q tests/test_whisper_hybrid.py
