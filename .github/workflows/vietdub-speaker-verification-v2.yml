name: VietDub speaker verification V2 Qt smoke

on:
  push:
    branches: [ci/run-vietdub-20261016]
    paths:
      - '.github/workflows/vietdub-speaker-verification-v2.yml'
      - 'speaker/verification.py'
      - 'ui/speaker_verification.py'
      - 'ui/review_source.py'
      - 'project/schema.py'
      - 'tests/test_speaker_v2_qt.py'
      - 'tests/test_speaker_verification_v2.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  speaker-native-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Qt Multimedia runtime and headless test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libopengl0 libpulse0 libasound2t64
          python -m pip install pytest PySide6
      - name: Compile speaker and Qt screens
        run: |
          python -m compileall -q speaker/verification.py ui/speaker_verification.py ui/review_source.py
      - name: Run actual native Qt dialog behavior and core speaker checks
        run: |
          python -m pytest -q \
            tests/test_speaker_v2_qt.py \
            tests/test_speaker_verification_v2.py
