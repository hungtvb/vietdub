name: VietDub source snapshot
on:
  push:
    branches:
      - ci/run-vietdub-20261016
  workflow_dispatch:
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package tested source
        run: git archive --format=tar HEAD | gzip > vietdub-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: vietdub-source
          path: vietdub-source.tar.gz
