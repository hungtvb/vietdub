name: Visual cleanup smoke
on:
  pull_request:
    paths:
      - 'media/visual_cleanup.py'
      - 'media/visual_precise.py'
      - 'media/visual_temporal.py'
      - 'media/visual_scene_guard.py'
      - 'media/visual_acceptance.py'
      - 'media/visual_neural.py'
      - 'media/visual_neural_window.py'
      - 'media/visual_lama_cpu.py'
      - 'media/visual_hybrid.py'
      - 'media/visual_dynamic_mask.py'
      - 'tests/test_visual_dynamic_mask.py'
      - 'tests/test_visual_hybrid.py'
      - 'tests/test_visual_lama_cpu.py'
      - 'media/visual_ocr_acceptance.py'
      - 'tests/test_visual_ocr_acceptance.py'
      - 'tests/test_visual_neural.py'
      - 'tests/test_visual_acceptance.py'
      - 'media/visual_cleanup_review.py'
      - 'tests/test_visual_temporal.py'
      - 'media/render.py'
      - 'media/editor.py'
      - 'core/orchestrator.py'
      - 'core/settings.py'
      - 'ui/settings_dialog.py'
      - 'tests/test_visual_cleanup.py'
      - 'tests/test_render.py'
      - 'tests/test_editor_none.py'
      - '.github/workflows/visual-cleanup.yml'
  workflow_dispatch:

jobs:
  visual-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated smoke dependencies
        run: |
          python -m pip install imageio-ffmpeg
          python - <<'PY'
          import imageio_ffmpeg, os
          from pathlib import Path
          link = Path(os.environ["RUNNER_TEMP"]) / "ffmpeg"
          link.symlink_to(imageio_ffmpeg.get_ffmpeg_exe())
          with open(os.environ["GITHUB_PATH"], "a") as out:
              out.write(str(link.parent) + "\n")
          PY
          python -m pip install --upgrade pip
          pip install pytest pytest-timeout numpy 'opencv-python-headless>=4.8,<5'
      - name: Test synthetic OCR and render (no ASR / OCR weights)
        timeout-minutes: 5
        run: |
         python -m compileall -q core/orchestrator.py media/editor.py media/visual_cleanup.py media/visual_temporal.py media/visual_scene_guard.py media/visual_cleanup_review.py media/visual_lama_cpu.py media/visual_hybrid.py media/visual_dynamic_mask.py media/visual_acceptance.py media/visual_ocr_acceptance.py media/visual_neural_window.py ui/settings_dialog.py
         pytest -vv --timeout=35 --timeout-method=signal tests/test_visual_cleanup.py tests/test_visual_temporal.py tests/test_render.py tests/test_editor_none.py tests/test_visual_acceptance.py tests/test_visual_neural.py tests/test_visual_ocr_acceptance.py tests/test_visual_lama_cpu.py tests/test_visual_hybrid.py tests/test_visual_dynamic_mask.py
