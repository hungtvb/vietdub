name: Visual cleanup smoke
on:
  pull_request:
    paths:
      - 'media/visual_cleanup.py'
      - 'media/render.py'
      - 'core/orchestrator.py'
      - 'core/settings.py'
      - 'ui/settings_dialog.py'
      - 'tests/test_visual_cleanup.py'
      - 'tests/test_render.py'
      - '.github/workflows/visual-cleanup.yml'
  workflow_dispatch:

jobs:
  visual-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated smoke dependencies
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install pytest numpy 'opencv-python-headless>=4.8,<5'
      - name: Test synthetic OCR and render (no ASR / OCR weights)
        run: pytest -q tests/test_visual_cleanup.py tests/test_render.py
