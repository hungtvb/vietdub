name: Audit ASR branch merge conflicts with main

on:
  push:
    branches: [ci/run-vietdub-20261016]
    paths: ['.github/workflows/asr-main-conflict-audit.yml']
  pull_request:
    paths: ['.github/workflows/asr-main-conflict-audit.yml']

permissions:
  contents: read

jobs:
  audit-merge:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Three-way merge dry run - NEVER push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'VietDub merge audit'
          git config user.email 'merge-audit@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main > merge-audit-output.log 2>&1 || true
          git status --short > merge-audit-status.txt
          git diff --name-only --diff-filter=U > merge-audit-conflicts.txt
          echo "Unresolved conflicts:"
          cat merge-audit-conflicts.txt
          echo "Merge diagnostics:"
          cat merge-audit-output.log
          if test -s merge-audit-conflicts.txt; then
            echo "::error::Cannot merge ASR branch into main yet"
            exit 1
          fi
          echo "No file-level merge conflict. Semantic tests are still required."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asr-main-three-way-conflict-evidence
          path: |
            merge-audit-output.log
            merge-audit-status.txt
            merge-audit-conflicts.txt
          if-no-files-found: warn
