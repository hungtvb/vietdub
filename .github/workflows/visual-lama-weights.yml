name: Fetch permissively licensed LaMa CPU checkpoint
on:
  pull_request:
    paths:
      - '.github/workflows/visual-lama-weights.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weights:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download Apache-2.0 LaMa checkpoint (not user video)
        run: |
          python -m pip install 'huggingface_hub[hf_xet]'
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from huggingface_hub import hf_hub_download
          path=Path(hf_hub_download(
              "signature-ai/big-lama","big-lama.pt",
              local_dir="weights"))
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          expected="344c77bbcb158f17dd143070d1e789f38a66c04202311ae3a258ef66667a9ea9"
          print(f"Downloaded {path} bytes={path.stat().st_size} sha256={digest}")
          assert digest==expected,"Checkpoint integrity mismatch"
          PY
      - name: Export checkpoint for offline CPU run
        uses: actions/upload-artifact@v4
        with:
          name: lama-weights-apache2
          path: weights/big-lama.pt
          retention-days: 1
          compression-level: 0
