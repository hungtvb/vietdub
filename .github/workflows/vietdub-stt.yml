name: VietDub STT adapter checks
on:
  pull_request:
    paths:
      - 'asr/vietdub_stt_adapter.py'
      - 'asr/factory.py'
      - 'tests/test_vietdub_stt_adapter.py'
      - '.github/workflows/vietdub-stt.yml'
  push:
    branches:
      - 'feat/optional-vietdub-stt'
jobs:
  stt-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest requests
      - run: python -m compileall -q asr core/settings.py ui/settings_dialog.py tests/test_vietdub_stt_adapter.py
      - run: python -m pytest -q tests/test_vietdub_stt_adapter.py
