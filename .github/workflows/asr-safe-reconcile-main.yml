name: Reconcile multilingual ASR with main (guarded one-time)

on:
  push:
    branches: [ci/run-vietdub-20261016]
    paths:
      - '.github/workflows/asr-safe-reconcile-main.yml'

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  reconcile:
    if: github.repository == 'hungtvb/vietdub' && github.ref == 'refs/heads/ci/run-vietdub-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Merge main preserving multilingual-specific conflict hunks
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main ci/run-vietdub-20261016
          git checkout -B ci/run-vietdub-20261016 origin/ci/run-vietdub-20261016
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          # -X ours resolves overlapping code in favor of multilingual ASR.
          # Main-only files and non-conflicting changes still merge normally.
          git merge --no-commit --no-ff -X ours origin/main
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git diff --cached --stat > /tmp/vietdub-main-merge-stat.log
          cat /tmp/vietdub-main-merge-stat.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install integration test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libopengl0 libxkbcommon-x11-0 libdbus-1-3
          python -m pip install -q pytest pytest-timeout numpy soundfile requests requests-toolbelt PySide6
      - name: Verify essential ASR and safety functionality survived reconciliation
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q asr core project translation tts ui media
          python - <<'PY'
          from pathlib import Path
          def must(path, *terms):
              source = Path(path).read_text(encoding="utf-8")
              missing = [term for term in terms if term not in source]
              assert not missing, f"{path}: missing integration features: {missing}"
          must("core/orchestrator.py", "select_asr_engine",
               "detect_source_language", "source_review", "SevereOverflowError")
          must("asr/whisper_align.py", "aligned_words_cover_source")
          must("core/checkpoint.py", "_nonempty_file", "identity_verified",
               "detected_speaker")
          must("tts/duration_fit.py", "MAX_OVERFLOW_RATIO")
          must("project/schema.py", "source_lang", "character_name")
          must("asr/factory.py", "vietdub_stt")
          print("Main safety and multilingual ASR features present.")
          PY
      - name: Test merged ASR, TTS, translation, checkpoint and STT contracts
        id: test
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q --disable-warnings --maxfail=12             tests/test_checkpoint.py             tests/test_orchestrator.py             tests/test_speaker_identity_pipeline.py             tests/test_whisper_hybrid.py             tests/test_tts_provider_guard.py             tests/test_asr_language_router.py             tests/test_translation.py             tests/test_duration_fit.py             tests/test_edge_tts.py             tests/test_vietdub_stt_adapter.py             tests/test_vietdub_stt_http_e2e.py             2>&1 | tee /tmp/vietdub-main-merge-test.log
      - name: Publish verified merge to the ASR PR branch only
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'merge: integrate main safety and recovery into multilingual ASR PR'
          git push origin HEAD:refs/heads/ci/run-vietdub-20261016
          echo "ASR branch reconciled at $(git rev-parse HEAD)"
      - name: Report verified success to PR 1
        if: success()
        shell: bash
        run: |
          printf '### ASR/main integration gate PASS\n\nMerged latest main into multilingual PR branch using explicit main-safety checks and focused scenario tests. Merge SHA: `%s`. **Not merged into main.**\n' "$(git rev-parse HEAD)" > /tmp/vietdub-merge-report.md
          gh pr comment 1 --body-file /tmp/vietdub-merge-report.md
      - name: Report failure to PR 1 without publishing merge
        if: failure()
        shell: bash
        run: |
          {
            echo '### ASR/main integration gate FAILED — no merge published'
            echo
            echo 'Source branch remains unchanged except for this workflow. Diagnostic tail:'
            echo '~~~'
            if test -f /tmp/vietdub-main-merge-test.log; then
              tail -n 95 /tmp/vietdub-main-merge-test.log
            elif test -f /tmp/vietdub-main-merge-stat.log; then
              tail -n 65 /tmp/vietdub-main-merge-stat.log
            else
              echo 'Failed before writing merge/test logs; inspect Actions step logs.'
            fi
            echo '~~~'
          } > /tmp/vietdub-merge-report.md
          gh pr comment 1 --body-file /tmp/vietdub-merge-report.md
