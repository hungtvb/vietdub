name: VietDub multilingual ASR and dubbing integration gates

on:
  pull_request:
    paths:
      - 'asr/**'
      - 'speaker/**'
      - 'translation/**'
      - 'tts/**'
      - 'core/**'
      - 'project/**'
      - 'ui/**'
      - 'tests/test_whisper_hybrid.py'
      - 'tests/test_asr_language_router.py'
      - 'tests/test_speaker_identity_pipeline.py'
      - 'tests/test_translation.py'
      - 'tests/test_orchestrator.py'
      - 'tests/test_checkpoint.py'
      - 'tests/test_edge_tts.py'
      - 'tests/test_tts_provider_guard.py'
      - 'tests/test_vietdub_stt_adapter.py'
      - 'tests/test_vietdub_stt_http_e2e.py'
      - '.github/workflows/vietdub-multilingual-gates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multilingual-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libopengl0 libxkbcommon-x11-0 libdbus-1-3
          python -m pip install -q pytest pytest-timeout numpy soundfile requests requests-toolbelt PySide6
      - name: Compile ASR, translation, checkpoint, TTS and UI modules
        run: python -m compileall -q asr speaker core project translation tts ui media
      - name: Run complete integration regression contract
        run: |
          python -m pytest -q --disable-warnings             tests/test_checkpoint.py             tests/test_orchestrator.py             tests/test_speaker_identity_pipeline.py             tests/test_whisper_hybrid.py             tests/test_tts_provider_guard.py             tests/test_asr_language_router.py             tests/test_translation.py             tests/test_duration_fit.py             tests/test_edge_tts.py             tests/test_vietdub_stt_adapter.py             tests/test_vietdub_stt_http_e2e.py
