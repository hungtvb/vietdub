name: Reconcile visual cleanup branch with main (one-time gate)

on:
  pull_request:
    paths:
      - '.github/workflows/visual-main-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'feat/visual-cleanup-engine' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Three-way merge latest main, no conflict override
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main feat/visual-cleanup-engine
          git checkout -B feat/visual-cleanup-engine origin/feat/visual-cleanup-engine
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          if ! git merge --no-commit --no-ff origin/main; then
            git status --short
            echo "::error::Conflicts found; no commit, no push"
            exit 1
          fi
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --stat
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal visual and UI smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libasound2t64
          python -m pip install -q pytest pytest-timeout numpy soundfile PySide6 'opencv-python-headless>=4.8,<5' imageio-ffmpeg
      # Legacy orchestrator/checkpoint tests use stale missing-file fixtures.
      # Keep this gate focused on visual acceptance with strict runtime checks.
      - name: Validate merged code and rendered video scenarios
        run: |
          python -m compileall -q core project media ui tests/test_visual_job_config.py
          python -m pytest -q --timeout=35 --timeout-method=signal tests/test_visual_job_config.py tests/test_visual_cleanup.py tests/test_visual_temporal.py tests/test_render.py tests/test_editor_none.py tests/test_visual_acceptance.py tests/test_visual_neural.py tests/test_visual_ocr_acceptance.py tests/test_visual_lama_cpu.py tests/test_visual_hybrid.py tests/test_visual_dynamic_mask.py tests/test_visual_user_regions.py tests/test_visual_tracking.py tests/test_visual_detection.py tests/test_ui_visual_region_editor.py
      - name: Push verified merge commit to visual PR branch only
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'merge: reconcile main stability fixes into visual cleanup PR'
          git push origin HEAD:refs/heads/feat/visual-cleanup-engine
