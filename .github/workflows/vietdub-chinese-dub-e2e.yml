name: VietDub Mandarin FunASR Chinese-to-Vietnamese Edge-TTS E2E
on:
  push:
    branches: [ci/run-vietdub-20261016]
    paths:
      - '.github/workflows/vietdub-chinese-dub-e2e.yml'
      - 'ci_chinese_regression.py'
      - 'ci_chinese_dub_e2e.py'
      - 'translation/llm_e2e.py'
      - 'translation/prompts.py'
      - 'asr/dub_grouping.py'
      - 'tests/test_chinese_dub_e2e.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chinese-dub:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MODELSCOPE_CACHE: ${{ github.workspace }}/.models
      HF_HOME: ${{ github.workspace }}/.hf
      OMP_NUM_THREADS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ffmpeg and CPU ASR
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libsndfile1
          pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install 'funasr==1.4.16' modelscope addict datasets pillow simplejson kaldi-native-fbank librosa sortedcontainers
          pip install 'faster-whisper>=1.1,<2' numpy scipy soundfile pytest edge-tts requests openai
      - name: Test strict source and duration QA
        run: |
          python -m compileall -q ci_chinese_regression.py ci_chinese_dub_e2e.py
          python -m pytest -q tests/test_chinese_dub_e2e.py
      - name: Restore pretrained Mandarin ASR
        uses: actions/cache@v4
        with:
          path: .models
          key: ${{ runner.os }}-vietdub-modelscope-automodel-v2
          restore-keys: |
            ${{ runner.os }}-vietdub-modelscope-
      - name: Download real Mandarin source from Wikimedia Commons
        run: |
          mkdir -p chinese_regression chinese_dub
          curl --fail --location --retry 4 --connect-timeout 30 \
            --user-agent 'VietDubE2E/1.0 (Mandarin language QA)' \
            'https://upload.wikimedia.org/wikipedia/commons/c/c3/%E3%80%90%E4%B8%A4%E4%BC%9A30%E7%A7%92%E3%80%91%E6%B0%B4%E5%BA%86%E9%9C%9E%EF%BC%9A%E4%B8%AD%E5%9B%BD%E5%A5%B3%E8%B6%B3%E9%9D%9E%E4%B8%96%E7%95%8C%E9%A1%B6%E7%BA%A7%EF%BC%8C%E4%BD%86%E4%BC%9A%E4%B8%8D%E6%96%AD%E8%BF%BD%E8%B5%B6.webm' \
            --output chinese_regression/mandarin_source.webm
          test -s chinese_regression/mandarin_source.webm
      - name: Transcribe full real Mandarin interview using FunASR AutoModel
        run: |
          python ci_chinese_regression.py --video chinese_regression/mandarin_source.webm --out chinese_regression --mode full --backend automodel
          python - <<'PY'
          import json
          r=json.load(open("chinese_regression/report.json"))
          assert r["status"] == "CHINESE_FUNASR_REAL_ASR_COMPLETE"
          assert r["actual_hanzi_count"] > 10
          assert len(r["source_video_sha256"]) == 64
          PY
      - name: Start local real Ollama LLM (no third-party translation service)
        run: |
          curl --fail --location https://ollama.com/install.sh -o /tmp/ollama-install.sh
          sh /tmp/ollama-install.sh
          ollama serve > /tmp/vietdub-ollama.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:11434/api/tags > /dev/null
          ollama pull qwen2.5:3b
          ollama list
      - name: Translate, generate REAL Edge-TTS, align and encode H264 MP4
        run: |
          python ci_chinese_dub_e2e.py --video chinese_regression/mandarin_source.webm --asr-report chinese_regression/report.json --out chinese_dub --llm-provider ollama --llm-model qwen2.5:3b
      - name: Check QA metrics and unapproved gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          q=json.load(open("chinese_dub/qa.json"))
          assert q["status"]=="RENDERED_TECHNICALLY_REVIEW_REQUIRED"
          assert q["technical_pass"] is True
          assert q["tts_provider"]=="Edge-TTS"
          assert q["tts"]["real_audio_files"]==q["dub_segment_count"]
          assert q["asr_segment_count"] == sum(
              len(g["original_asr_ids"])
              for g in q["dub_grouping"]["original_id_mapping"])
          assert q["tts"]["failed_audio_files"]==0
          assert q["translation"]["human_approved"] is False
          assert q["translation"]["provider"]=="ollama"
          assert q["translation"]["llm_call_counts"]["analyze"] >= 1
          assert q["translation"]["llm_call_counts"]["translate"] >= 1
          assert q["llm_analysis_executed"] is True
          assert q["llm_translation_executed"] is True
          assert q["llm_revision"]["human_approved"] is False
          assert q["llm_revision"]["method"] == "individual_source_line_revision"
          assert q["translation_review_status"] in ("FLAGGED_NEEDS_REVIEW",
                                                   "HEURISTICS_CLEAR_HUMAN_REVIEW_REQUIRED")
          assert q["translation_quality_flags"]["is_ground_truth_score"] is False
          assert q["translation_quality_pass"] is False
          assert q["human_approved"] is False
          assert q["video"]["size_bytes"]>20000
          assert Path("chinese_dub/chinese_vidub_UNAPPROVED.mp4").is_file()
          print("REAL_CHINESE_EDGE_TTS_TECHNICAL_QA_PASS")
          PY
      - name: Upload regression report even if E2E fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mandarin-funasr-edge-tts-QA
          path: |
            chinese_regression/report.json
            chinese_dub/qa.json
            chinese_dub/review_lines.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload reviewed-required dubbed video and bilingual SRT
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: real-mandarin-edge-tts-dubbed-video-UNAPPROVED
          path: |
            chinese_dub/chinese_vidub_UNAPPROVED.mp4
            chinese_dub/chinese_source.srt
            chinese_dub/vietnamese_review.srt
          if-no-files-found: error
          retention-days: 7
