name: VietDub runtime checks

on:
  push:
    branches:
      - ci/run-vietdub-20261016
  workflow_dispatch:

jobs:
  test-and-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test and UI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest numpy soundfile librosa edge-tts gtts openai requests yt-dlp PySide6
      - name: Static compile
        run: python -m compileall -q .
      - name: Unit tests
        run: python -m pytest tests/ -q
      - name: GUI startup smoke
        run: |
          python - <<'PY'
          from PySide6.QtCore import QTimer
          from PySide6.QtWidgets import QApplication
          from core.settings import Settings
          from ui.main_window import MainWindow
          app = QApplication([])
          app.setApplicationName("VietDub")
          app.setOrganizationName("VietDub")
          win = MainWindow(Settings())
          win.show()
          QTimer.singleShot(1500, app.quit)
          assert app.exec() == 0
          print("VIETDUB_UI_SMOKE_OK")
          PY
