name: VietDub stack four PRs with cross-feature gates (temporary)

on:
  pull_request:
    paths: ['.github/workflows/vietdub-stack-prs.yml']

permissions:
  contents: write

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'feat/visual-cleanup-engine' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Compose staged merges entirely in local runner; do NOT publish yet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main ci/windows-release-smoke-20261031 ci/run-vietdub-20261016 feat/vieneu-tts-v3 feat/visual-cleanup-engine
          test "$(git rev-parse origin/feat/visual-cleanup-engine)" = "${{ github.event.pull_request.head.sha }}"
          git checkout -B stack/pr1 origin/ci/run-vietdub-20261016
          git merge --no-ff --no-edit origin/ci/windows-release-smoke-20261031
          git checkout -B stack/pr4 origin/feat/vieneu-tts-v3
          git merge --no-ff --no-edit -X ours stack/pr1
          git checkout -B stack/pr6 origin/feat/visual-cleanup-engine
          git merge --no-ff --no-edit -X ours stack/pr4
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check origin/main HEAD
          git log --oneline --max-count=7
          echo "Verified local ancestry: PR11 -> PR1 -> PR4 -> PR6"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare integration runners
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3
          python -m pip install -q pytest pytest-timeout numpy soundfile requests requests-toolbelt PySide6 'opencv-python-headless>=4.8,<5' imageio-ffmpeg
      - name: Validate PR1 with packaged FFmpeg foundation
        shell: bash
        run: |
          set -euo pipefail
          git checkout stack/pr1
          python -m compileall -q asr speaker core project translation tts ui media
          python -m pytest -q --disable-warnings             tests/test_checkpoint.py tests/test_orchestrator.py             tests/test_speaker_identity_pipeline.py tests/test_whisper_hybrid.py             tests/test_tts_provider_guard.py tests/test_asr_language_router.py             tests/test_translation.py tests/test_duration_fit.py             tests/test_edge_tts.py tests/test_vietdub_stt_adapter.py             tests/test_vietdub_stt_http_e2e.py
      - name: Validate PR4 on top of PR1 without losing multilingual or TTS provider features
        shell: bash
        run: |
          set -euo pipefail
          git checkout stack/pr4
          python -m compileall -q asr core project translation tts ui media
          python -m pytest -q --disable-warnings             tests/test_checkpoint.py tests/test_orchestrator.py             tests/test_speaker_identity_pipeline.py tests/test_whisper_hybrid.py             tests/test_tts_provider_guard.py tests/test_asr_language_router.py             tests/test_translation.py tests/test_duration_fit.py             tests/test_edge_tts.py tests/test_vietdub_stt_adapter.py             tests/test_vietdub_stt_http_e2e.py tests/test_vieneu_tts.py             tests/test_vieneu_ui.py
      - name: Validate PR6 full stack with visual, translation, ASR and TTS
        shell: bash
        run: |
          set -euo pipefail
          git checkout stack/pr6
          python -m compileall -q asr speaker core project translation tts ui media
          python -m pytest -q --disable-warnings             tests/test_checkpoint.py tests/test_orchestrator.py             tests/test_speaker_identity_pipeline.py tests/test_whisper_hybrid.py             tests/test_tts_provider_guard.py tests/test_asr_language_router.py             tests/test_translation.py tests/test_duration_fit.py             tests/test_edge_tts.py tests/test_vietdub_stt_adapter.py             tests/test_vietdub_stt_http_e2e.py             tests/test_vieneu_tts.py tests/test_vieneu_ui.py             tests/test_visual_job_config.py tests/test_visual_cleanup.py             tests/test_visual_temporal.py tests/test_visual_user_regions.py             tests/test_visual_tracking.py tests/test_visual_detection.py             tests/test_render.py
      - name: End-to-end UI snapshot of BOTH cleanup and pinned VieNeu configuration
        shell: bash
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from PySide6.QtWidgets import QApplication
          import core.job as jobmodule
          from core.job import Job
          from core.settings import Settings
          from core.orchestrator import Orchestrator
          from ui.main_window import MainWindow
          from media.visual_source_identity import file_sha256
          with tempfile.TemporaryDirectory() as temp:
              root = Path(temp)
              jobmodule.JOBS_ROOT = root / "jobs"
              src = root / "source.mp4"
              src.write_bytes(b"test-source-fingerprint")
              settings = Settings(path=root / "settings.json")
              settings.set("visual_cleanup_enabled", True)
              settings.set("visual_cleanup_backend", "cv")
              settings.set("visual_cleanup_mode", "blur")
              app = QApplication.instance() or QApplication([])
              ui = MainWindow(settings)
              try:
                  idx = ui.tts_provider.findData("vieneu")
                  assert idx >= 0
                  ui.tts_provider.setCurrentIndex(idx)
                  job = ui._configure_job(Job(), str(src))
                  options = job.project.visual_cleanup_options
                  assert job.project.tts_provider == "vieneu"
                  assert options["visual_cleanup_enabled"]
                  assert options["visual_cleanup_source_sha256"] == file_sha256(src)
                  orch = Orchestrator(job, settings)
                  voice_identity = orch._tts_config()
                  render_identity = orch._visual_cleanup_signature()
                  assert voice_identity["provider"] == "vieneu"
                  assert render_identity["enabled"] is True
                  settings.set("tts_provider", "edge")
                  settings.set("visual_cleanup_mode", "inpaint")
                  settings.set("visual_cleanup_enabled", False)
                  assert orch._tts_config() == voice_identity
                  assert orch._visual_cleanup_signature() == render_identity
                  print("Joint UI/job snapshots and replay identities PASS")
              finally:
                  ui.close()
          PY
      - name: Publish 3 verified dependent PR heads, NEVER main
        shell: bash
        run: |
          set -euo pipefail
          git push origin stack/pr1:refs/heads/ci/run-vietdub-20261016
          git push origin stack/pr4:refs/heads/feat/vieneu-tts-v3
          git push origin stack/pr6:refs/heads/feat/visual-cleanup-engine
          echo "All PR branches advanced with history 11 -> 1 -> 4 -> 6"
